version: '3.8'
services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - SESSION_SECRET=${SESSION_SECRET:-change_this}
    volumes:
      - ./uploads:/app/uploads
      - ./db:/app/db
    restart: unless-stopped
